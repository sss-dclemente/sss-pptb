<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSS Offboarding Wizard</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="content" style="height:100%">
    <header class="topbar">
      <div class="brand">
        <span class="eyebrow">Simple Smooth Safe</span>
        <h1>Offboarding Wizard</h1>
      </div>
      <span id="conn" class="connchip" aria-label="Connection"></span>
      <span class="spacer"></span>
      <span id="leaver-chip" class="connchip" hidden></span>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-tab="leaver" role="tab" type="button">1 · Leaver</button>
      <button class="tab" data-tab="inventory" role="tab" type="button">2 · Inventory</button>
      <button class="tab" data-tab="plan" role="tab" type="button">3 · Plan &amp; apply</button>
      <button class="tab" data-tab="report" role="tab" type="button">4 · Report</button>
    </nav>

    <div id="status" class="status" hidden></div>
    <div id="progress" class="progress" hidden>
      <div class="bar"><span id="progress-fill"></span></div>
      <span id="progress-text" class="caption"></span>
      <button id="btn-cancel" class="btn btn-ghost btn-sm" type="button">Cancel</button>
    </div>

    <main class="main">
      <section id="tab-leaver" class="panel">
        <form class="inputs" id="leaver-form" autocomplete="off">
          <div class="field">
            <label for="leaver-q">Leaver</label>
            <div class="suggest-wrap">
              <input id="leaver-q" type="search" placeholder="Name, domain or email…" aria-label="Leaver search" />
              <ul id="leaver-results" class="suggest" hidden></ul>
            </div>
          </div>
        </form>
        <div id="leaver-detail"></div>
      </section>

      <section id="tab-inventory" class="panel" hidden>
        <div class="toolbar">
          <label for="scan-filter">Scan tables matching</label>
          <input id="scan-filter" type="search" placeholder="all owned tables" aria-label="Table filter" />
          <label class="check"><input id="scan-hide-empty" type="checkbox" checked /> hide tables with no records</label>
          <button id="btn-scan" class="btn btn-primary btn-sm" type="button" disabled>Scan owned records</button>
        </div>
        <div id="inventory-body"></div>
      </section>

      <section id="tab-plan" class="panel" hidden></section>

      <section id="tab-report" class="panel" hidden></section>
    </main>

    <footer class="footer" style="padding: var(--s-2) var(--s-5); margin-top: 0; flex-direction: row; justify-content: space-between; align-items: center;">
      <a href="https://simplesmoothsafe.com" target="_blank" rel="noopener">Simple Smooth Safe</a>
      <span class="caption" id="host-mode"></span>
    </footer>
  </div>

  <dialog id="dlg">
    <div class="dlg-head"><h3 id="dlg-title">Preview</h3><span class="spacer" style="flex:1"></span><span id="dlg-target" class="target"></span></div>
    <div class="dlg-body" id="dlg-body"></div>
    <div class="dlg-foot">
      <button id="dlg-cancel" class="btn btn-ghost" type="button">Cancel</button>
      <button id="dlg-ok" class="btn btn-primary" type="button" style="flex:none">Confirm</button>
    </div>
  </dialog>

  <script type="module" src="./main.ts"></script>
</body>
</html>
