<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSS D365 Apps Matrix</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="content" style="height:100%">
    <header class="topbar">
      <div class="brand">
        <span class="eyebrow">Simple Smooth Safe</span>
        <h1>D365 Apps Matrix</h1>
      </div>
      <span id="conn" class="conns" aria-label="Connection"></span>
      <span class="spacer"></span>
      <button id="btn-envs" class="btn btn-sm" type="button" disabled>Environments…</button>
      <button id="btn-refresh" class="btn btn-sm" type="button" disabled>Refresh</button>
      <button id="btn-export-csv" class="btn btn-ghost btn-sm" type="button" disabled>Matrix CSV</button>
      <button id="btn-unused" class="btn btn-sm" type="button" disabled title="Read-only report: which installed apps in the connection's environment look unused (row counts in their own tables)">Unused apps…</button>
    </header>

    <div id="setup"></div>

    <div class="toolbar">
      <input id="filter-text" type="search" placeholder="Filter apps…" aria-label="Filter apps" />
      <label class="check" title="Also list apps available to install that no selected environment has"><input type="checkbox" id="show-available" /> Show not installed</label>
      <label class="check" title="Hide environment columns with nothing installed, failed or in progress (apps only available to install do not count). Unreadable environments always show."><input type="checkbox" id="hide-empty" checked /> Hide empty environments</label>
      <button id="btn-select-updates" class="btn btn-sm" type="button" disabled title="Tick every update (rows hidden by the filters and hidden environment columns are left out)">Select all updates</button>
      <button id="btn-select-failed" class="btn btn-sm" type="button" disabled title="Tick every failed install for a retry (rows hidden by the filter and hidden environment columns are left out)">Select all failed</button>
      <button id="btn-clear-sel" class="btn btn-ghost btn-sm" type="button" disabled>Clear selection</button>
      <div class="right">
        <span id="sel-count" class="caption"></span>
        <button id="btn-pac" class="btn btn-ghost btn-sm" type="button" disabled title="PowerShell script with the same installs through pac application install">pac script</button>
        <button id="btn-preview" class="btn btn-primary btn-sm" type="button" disabled>Preview…</button>
      </div>
    </div>

    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    <div id="summary" class="summary-line"></div>

    <section id="unused" class="unused" hidden>
      <div class="run-head">
        <h3>Unused apps: <span id="unused-env"></span></h3>
        <input id="unused-filter" type="search" placeholder="Filter apps…" aria-label="Filter the unused apps report" />
        <label class="check caption"><input type="checkbox" id="unused-all" /> Show all (in use, platform)</label>
        <span class="spacer"></span>
        <button id="btn-unused-rerun" class="btn btn-ghost btn-sm" type="button" disabled title="Read the row counts again (the report is kept while hidden)">Re-run</button>
        <button id="btn-unused-csv" class="btn btn-ghost btn-sm" type="button" disabled>Report CSV</button>
        <button id="btn-unused-hide" class="btn btn-ghost btn-sm" type="button" title="Hide the report; Unused apps… shows it again without re-reading">Hide</button>
      </div>
      <div id="unused-body"></div>
    </section>

    <main class="matrix-wrap" id="matrix"></main>

    <section id="run" class="run" hidden>
      <details id="run-fold" open>
        <summary class="chev"><h3 id="run-title">Run</h3></summary>
        <div id="run-body"></div>
      </details>
      <div class="run-actions">
        <label class="check caption" title="Hide installs that succeeded"><input type="checkbox" id="run-problems" /> Only problems</label>
        <button id="btn-stop" class="btn btn-sm" type="button" hidden>Stop waiting</button>
        <button id="btn-results-csv" class="btn btn-ghost btn-sm" type="button">Results CSV</button>
        <button id="btn-run-dismiss" class="btn btn-ghost btn-sm" type="button" title="Clear the run list (export Results CSV first to keep it)">Dismiss</button>
      </div>
    </section>

    <footer class="footer" style="padding: var(--s-2) var(--s-5); margin-top: 0; flex-direction: row; justify-content: space-between; align-items: center;">
      <a href="https://simplesmoothsafe.com" target="_blank" rel="noopener">Simple Smooth Safe</a>
      <span class="caption" id="host-mode"></span>
    </footer>
  </div>

  <dialog id="dlg">
    <div class="dlg-head"><h3 id="dlg-title">Confirm</h3><span class="spacer" style="flex:1"></span><span id="dlg-target" class="target"></span></div>
    <div class="dlg-body" id="dlg-body"></div>
    <div class="dlg-foot">
      <button id="dlg-cancel" class="btn btn-ghost" type="button">Cancel</button>
      <button id="dlg-ok" class="btn btn-primary" type="button" style="flex:none">OK</button>
    </div>
  </dialog>

  <script type="module" src="./main.ts"></script>
</body>
</html>
